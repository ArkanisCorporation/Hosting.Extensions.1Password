# Reusable production release lane.
#
# Runs semantic-release for real via the shared ci platform: computes the version, updates the
# changelog notes, tags, and creates the GitHub release. It deliberately does NOT pack or publish
# NuGet packages - that moved to _publish-nuget-package.yaml, gated on this job's `new-version`
# output. The platform's wf-release-semantic rejects @semantic-release/exec, which is why the old
# exec-driven pack/publish scripts were removed from .releaserc.json.
name: .NET Release

permissions: {}

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner pool (override to ubuntu-latest if self-hosted is broken)"
        type: choice
        options:
          - daedalus
          - arkanis-runners
          - ubuntu-latest
        default: daedalus
      environment_name:
        description: "GitHub environment that guards release publication"
        required: false
        type: environment
        default: release
  workflow_call:
    inputs:
      runner:
        description: "Runner pool"
        required: false
        type: string
        default: daedalus
      environment_name:
        description: "GitHub environment that guards release publication"
        required: false
        type: string
        default: release
    outputs:
      new-version:
        description: "Newly published version"
        value: ${{ jobs.release.outputs.new-version }}
      new-tag:
        description: "New tag"
        value: ${{ jobs.release.outputs.new-tag }}
      new-channel:
        description: "New release channel"
        value: ${{ jobs.release.outputs.new-channel }}
      last-version:
        description: "Previously published version"
        value: ${{ jobs.release.outputs.last-version }}
      last-tag:
        description: "Previous version tag"
        value: ${{ jobs.release.outputs.last-tag }}
      release-published:
        description: "Whether semantic-release published a release"
        value: ${{ jobs.release.outputs.release-published }}

jobs:
  release:
    name: Release
    uses: ArkanisCorporation/ci/.github/workflows/wf-release-semantic.yml@v1
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      runs-on: ${{ inputs.runner }}
      runs-on-self-hosted: ${{ inputs.runner != 'ubuntu-latest' }}
      environment-name: ${{ inputs.environment_name }}
