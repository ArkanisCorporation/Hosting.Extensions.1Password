# Top-level CI/CD orchestrator.
#
# Wires the reusable lanes together on the shared ci platform:
#   lint-workflows -> test + verify-release (dry run) -> verify-nuget -> release -> publish-nuget
#                                                                              \-> release-backpropagation
# The release job runs only off pull requests, on the default branch or a release/* branch, and
# only when the dry run computed a version. verify-release still runs on pull requests and the ci
# branch, so those get validation without publishing.
name: .NET build

on:
  push:
    branches: [ main, release/*, ci ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner pool (override to ubuntu-latest if self-hosted is broken)"
        type: choice
        options:
          - daedalus
          - arkanis-runners
          - ubuntu-latest
        default: daedalus

permissions: {}

jobs:
  lint-workflows:
    name: Workflow
    uses: ArkanisCorporation/ci/.github/workflows/wf-lint-github-actions.yml@v1
    permissions:
      contents: read
    with:
      runs-on: ${{ inputs.runner || vars.RUNNER_DEFAULT || 'daedalus' }}
      runs-on-self-hosted: ${{ (inputs.runner || vars.RUNNER_DEFAULT || 'daedalus') != 'ubuntu-latest' }}

  test:
    name: Tests
    uses: ./.github/workflows/_test.yaml
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
    with:
      runner: ${{ inputs.runner || vars.RUNNER_DEFAULT || 'daedalus' }}

  verify-release:
    name: Verify - Release
    uses: ./.github/workflows/_verify-release.yaml
    permissions:
      contents: write
    with:
      runner: ${{ inputs.runner || vars.RUNNER_DEFAULT || 'daedalus' }}

  verify-nuget:
    name: Verify - NuGet
    if: ${{ needs.verify-release.outputs.new-version != '' }}
    needs:
      - lint-workflows
      - test
      - verify-release
    uses: ./.github/workflows/_verify-nuget-package.yaml
    permissions:
      contents: read
    with:
      runner: ${{ inputs.runner || vars.RUNNER_DEFAULT || 'daedalus' }}
      version: ${{ needs.verify-release.outputs.new-version }}

  release:
    name: Release
    if: ${{ needs.verify-release.outputs.new-version != '' && github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'release/')) }}
    needs:
      - verify-release
      - verify-nuget
    uses: ./.github/workflows/_release.yaml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    secrets: inherit
    with:
      runner: ${{ inputs.runner || vars.RUNNER_DEFAULT || 'daedalus' }}
      environment_name: release

  publish-nuget:
    name: Publish - NuGet
    if: ${{ needs.release.outputs.new-version != '' }}
    needs: release
    uses: ./.github/workflows/_publish-nuget-package.yaml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      runner: ${{ inputs.runner || vars.RUNNER_DEFAULT || 'daedalus' }}
      version: ${{ needs.release.outputs.new-version }}
      environment_name: publish-nuget

  release-backpropagation:
    name: "Release: Backpropagation"
    if: ${{ needs.release.outputs.new-version != '' && github.ref == 'refs/heads/release/stable' }}
    needs: release
    uses: ./.github/workflows/_release-backpropagation.yaml
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
    with:
      runner: ${{ inputs.runner || vars.RUNNER_DEFAULT || 'daedalus' }}
      new-version: ${{ needs.release.outputs.new-version }}
      release-ref-name: ${{ github.ref_name }}
      default-branch: ${{ github.event.repository.default_branch }}
