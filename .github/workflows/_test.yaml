# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Test

concurrency:
  group: "test-${{ github.ref }}"
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner pool"
        required: false
        type: string
        default: daedalus

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    steps:
      -   name: Git checkout
          uses: actions/checkout@v7

      # Caches NuGet's default global-packages folder. Do not point NUGET_PACKAGES at the
      # workspace to shrink it: the cache `version` is a hash of the literal path, and every
      # daedalus replica has its own workspace, so that split the cache into one namespace per
      # replica, each ageing on its own until a stale one broke restores outright (ARK-502).
      -   name: Setup .NET
          id: setup-dotnet
          uses: actions/setup-dotnet@v6
          with:
            cache: true
            cache-dependency-path: "**/packages.lock.json"

      -   run: echo "Using .NET ${{ steps.setup-dotnet.outputs.dotnet-version }}"

      -   run: echo "Cache hit - ${{ steps.setup-dotnet.outputs.cache-hit }}"

      -   name: Restore dependencies
          run: dotnet tool restore

      -   name: Restore dependencies
          run: dotnet restore --locked-mode

      -   name: Build solution
          run: dotnet build --no-restore

      -   name: Test solution
          run: dotnet test --no-build --verbosity normal --filter "Category!=Integration"
