# Reusable .NET test lane.
#
# Wraps the shared ci platform's reusable test workflow instead of hand-rolling
# actions/setup-dotnet + the NuGet actions cache. On the self-hosted daedalus pool the
# platform's setup-dotnet composite detects ARKANIS_PERSISTENT_NUGET_PACKAGES=true and skips
# the NuGet actions cache entirely (the global-packages folder already lives on persistent
# per-worker disk), which the old hand-rolled `cache: true` defeated and mis-keyed (ARK-579).
name: .NET Test

permissions: {}

concurrency:
  group: "test-${{ github.ref }}"
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner pool"
        required: false
        type: string
        default: daedalus

jobs:
  coverage:
    name: Coverage
    uses: ArkanisCorporation/ci/.github/workflows/wf-dotnet-test.yml@v1
    permissions:
      contents: read
      pull-requests: write # for the single updated coverage comment on pull requests
    with:
      runs-on: ${{ inputs.runner }}
      runs-on-self-hosted: ${{ inputs.runner != 'ubuntu-latest' }}
      global-json-file: global.json
      solution: Hosting.Extensions.1Password.slnx
      # Integration tests require a live 1Password setup and are excluded from CI, matching the
      # previous hand-rolled `dotnet test --filter "Category!=Integration"` step.
      test-filter: "Category!=Integration"
